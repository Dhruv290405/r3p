<!DOCTYPE html><html lang="en"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pulse-animation {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .glow-red {
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }
    </style>

                      "on-primary-fixed-variant": "#153ea3",
                      "secondary": "#b6171e",
                      "primary-fixed": "#dce1ff",
                      "tertiary": "#4f1100",
                      "background": "#fbf9f8",
                      "outline-variant": "#c4c5d5",
                      "primary-container": "#003399",
                      "secondary-fixed": "#ffdad6",
                      "surface-dim": "#dcd9d9",

<body class="bg-[#D32F2F] min-h-screen flex flex-col font-body-md text-white overflow-hidden">
<!-- Top Status Bar (System-like) -->
<div class="h-8 flex items-center justify-between px-4 opacity-60">
<span class="text-xs font-mono-data">R3P_SYS_V2.0</span>
<span class="text-xs font-mono-data" id="current-time">14:22:05</span>
</div>
<!-- Main Alert Content -->
<main class="flex-grow flex flex-col items-center justify-center px-container-padding pt-stack-md pb-stack-lg">
<!-- Pulsing Icon Container -->
<div class="relative mb-stack-lg">
<div class="absolute inset-0 bg-white opacity-20 rounded-full pulse-animation"></div>
<div class="relative w-24 h-24 bg-white rounded-full flex items-center justify-center text-[#D32F2F] glow-red">
<span class="material-symbols-outlined text-6xl" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
</div>
<!-- Critical Headline -->
<h1 class="font-display-lg text-display-lg-mobile text-center leading-none mb-stack-md uppercase tracking-tighter">
            CRITICAL EMERGENCY ALERT
        </h1>
<!-- Incident Info Card -->
<div class="w-full bg-black/20 backdrop-blur-sm rounded-xl p-stack-md border border-white/20 mb-stack-lg">
<div class="flex items-center gap-unit mb-unit opacity-80">
<span class="material-symbols-outlined text-sm">train</span>
<span class="font-label-lg uppercase tracking-widest">Incident Details</span>
</div>
<div class="space-y-unit">
<p class="font-headline-md text-headline-md leading-tight">Derailment - Train 12424</p>
<div class="flex items-center gap-unit text-white/90">
<span class="material-symbols-outlined text-sm">location_on</span>
<p class="font-body-lg text-body-lg">Location: KM 422, North Zone</p>
</div>
</div>
</div>
<!-- Action Section -->
<div class="w-full flex flex-col gap-stack-md">
<!-- Primary Action -->
<button class="w-full h-16 bg-white text-emerald-700 rounded-xl flex items-center justify-center gap-unit transition-all active:scale-95 shadow-xl">
<span class="material-symbols-outlined font-bold">check_circle</span>
<span class="font-headline-sm uppercase font-black">ACCEPT &amp; ON MY WAY</span>
</button>
<!-- Secondary Actions -->
<div class="flex flex-col gap-unit">
<button class="w-full h-14 border-2 border-white/40 text-white rounded-xl flex items-center justify-center gap-unit transition-all active:bg-white/10">
<span class="material-symbols-outlined text-xl">block</span>
<span class="font-label-lg uppercase">CANNOT RESPOND</span>
</button>
<button class="w-full h-14 border-2 border-white/40 text-white rounded-xl flex items-center justify-center gap-unit transition-all active:bg-white/10">
<span class="material-symbols-outlined text-xl">help_center</span>
<span class="font-label-lg uppercase">NEED SUPPORT</span>
</button>
</div>
</div>
</main>
<!-- Map Context Overlay (Minimal) -->
<div class="px-container-padding pb-24">
<div class="h-32 w-full rounded-xl overflow-hidden relative border border-white/30">
<img alt="Map context" class="w-full h-full object-cover grayscale opacity-50" data-alt="A detailed satellite view map of a rural Indian railway junction with multiple tracks merging into a single line. The scene is overcast with a dramatic, high-contrast atmosphere. The visual style is professional, data-driven, and serves as a technical backdrop for an emergency control room interface. The map is overlaid with a subtle red tint to match the emergency dashboard aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD2r3eOFmJEqWM_vsVorb07OOhzfepPOJa09n6XfUZbCK8PUa-1W4ztzRkFLzzwkCpPj_Fd6rKHvWhHCAPePu8-4xG9z2fPgqdQFim0iCEaw_ZLTTm5BluKNj0kJf-dK-tZuC9o2bpPJiljbUfK2lJnixT17CXCVi_v-o-RoRDuKyM_E83fnP8rTLhBhPN_A99_eNQ2asMhWQAtjrhdX3nSUxnQb3xY_su7zpvu3D83RIORThVdl2JDYaGV5JiExtBru17dcn2_hfs">
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-4 h-4 bg-white rounded-full pulse-animation shadow-lg"></div>
</div>
<div class="absolute bottom-2 right-2 bg-black/40 px-2 py-1 rounded text-[10px] font-mono-data">
                LAT: 28.6139 | LON: 77.2090
            </div>
</div>
</div>
<!-- Hidden Bottom Bar as mandated by Shared Components Logic but strictly minimized -->
<nav class="lg:hidden fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-4 bg-black/10 backdrop-blur-md border-t border-white/10">
<div class="flex flex-col items-center justify-center bg-white/20 text-white rounded-full px-6 py-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">emergency</span>
<span class="font-label-md-mobile mt-1 uppercase">Active</span>
</div>
<div class="flex flex-col items-center justify-center text-white/50 px-4 py-2 opacity-30 pointer-events-none">
<span class="material-symbols-outlined">support</span>
<span class="font-label-md-mobile mt-1 uppercase">Response</span>
</div>
<div class="flex flex-col items-center justify-center text-white/50 px-4 py-2 opacity-30 pointer-events-none">
<span class="material-symbols-outlined">history</span>
<span class="font-label-md-mobile mt-1 uppercase">History</span>
</div>
<div class="flex flex-col items-center justify-center text-white/50 px-4 py-2 opacity-30 pointer-events-none">
<span class="material-symbols-outlined">account_circle</span>
<span class="font-label-md-mobile mt-1 uppercase">Profile</span>
</div>
</nav>
<script>
        // Real-time clock for system feel
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('current-time').textContent = `${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Haptic feedback simulation
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                if ('vibrate' in navigator) {
                    navigator.vibrate(50);
                }
            });
        });

        // Trigger pulse on interval
        setInterval(() => {
            const icon = document.querySelector('.glow-red');
            icon.classList.add('scale-110');
            setTimeout(() => icon.classList.remove('scale-110'), 200);
        }, 3000);
    </script>
</body></html>
